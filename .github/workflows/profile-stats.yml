name: Refresh profile activity
on:
  schedule:
    - cron: "35 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read visible GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_stats.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md assets/profile/activity.svg assets/profile/activity-mobile.svg assets/profile/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh GitHub activity"
            git push
          fi
